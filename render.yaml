services:
  - type: web
    name: spool-verification
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 wsgi:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true   # Render automatically generates a secure random value
      - key: PYTHON_VERSION
        value: "3.12"
